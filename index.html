<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalOTP · 账号管理</title>
    <link rel="icon" href="assets/icons/icon32.png" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/overlays.css" />
    <link rel="stylesheet" href="styles/page.css" />
    <link rel="stylesheet" href="styles/finish.css" />
    <link rel="stylesheet" href="styles/color-schemes.css" />
    <link rel="stylesheet" href="styles/studio.css" />
    <link rel="stylesheet" href="styles/window-tools.css" />
    <link rel="stylesheet" href="styles/scan.css" />
    <script src="js/version.js"></script>
    <script src="js/theme-boot.js"></script>
    <script src="js/window-boot.js"></script>
  </head>
  <!-- 管理页形态：与弹窗共享同一套组件，只有 data-surface 与外壳不同 -->
  <body data-surface="page" data-locked="1">
    <div class="stage">
      <div class="page" id="app">
        <aside class="sidebar" aria-label="导航">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.6 19.3 6.4v5.1c0 4.2-3 7.4-7.3 9-4.3-1.6-7.3-4.8-7.3-9V6.4z" />
                <path d="m8.9 12 2.2 2.2 4-4.2" />
              </svg>
            </div>
            <div class="brand-text">
              <div class="brand-name">LocalOTP</div>
              <div class="brand-sub">本机账号库</div>
            </div>
            <button class="ibtn" id="side-lock" type="button" data-tip="立即锁定 · L" aria-label="立即锁定">
              <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4.6" y="10.2" width="14.8" height="10" rx="2.9" />
                <path d="M8.2 10.2V7.6a3.8 3.8 0 0 1 7.6 0v2.6" />
                <circle cx="12" cy="15.1" r="1.15" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>

          <div class="nav-title">账号</div>
          <nav class="nav" id="nav" aria-label="账号筛选"></nav>

          <div class="sidebar-foot">
            <a class="btn btn-ghost sidebar-tool" href="api.html" target="_blank" rel="noopener" aria-label="打开临时验证码页面"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m8 9-3 3 3 3m8-6 3 3-3 3m-3-7-2 8"/></svg>临时验证码</a>
            <div class="storage-line">
              <span>本机账号库</span>
              <span>同步可在设置中开启</span>
            </div>
            <div class="side-actions">
              <button class="btn btn-ghost" id="side-import" type="button">
                <svg class="i" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 15.8V4.6" />
                  <path d="m7.6 9 4.4-4.4L16.4 9" />
                  <path d="M4.6 15v3.4a1.8 1.8 0 0 0 1.8 1.8h11.2a1.8 1.8 0 0 0 1.8-1.8V15" />
                </svg>
                导入
              </button>
              <button class="btn btn-ghost" id="side-settings" type="button">
                <svg class="i" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3.9 7.4h9.3M17.5 7.4h2.6M3.9 16.6h2.6M10.9 16.6h9.2" />
                  <circle cx="15.3" cy="7.4" r="2.2" />
                  <circle cx="8.6" cy="16.6" r="2.2" />
                </svg>
                设置
              </button>
            </div>
          </div>
        </aside>

        <main class="main" id="screen" aria-label="账号列表">
          <header class="main-head">
            <div class="main-titles">
              <h1 class="main-title"><span id="page-title">全部账号</span><span class="count" id="page-count">0</span></h1>
              <p class="main-sub" id="page-sub">验证码每 30 秒自动刷新</p>
            </div>

            <div class="main-tools">
              <div class="search">
                <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <circle cx="10.8" cy="10.8" r="6.3" />
                  <path d="m15.4 15.4 4.3 4.3" />
                </svg>
                <input id="page-search" type="text" placeholder="搜索邮箱、服务或验证码…" autocomplete="off" spellcheck="false" aria-label="搜索账号" />
                <div class="search-right"><kbd>Ctrl K</kbd></div>
              </div>

              <div class="view-switch-slot" id="page-view-slot"></div>

              <button class="ibtn" id="scan-btn" type="button" data-tip="扫码与导入 OTP" aria-label="扫码与导入 OTP"><svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M3 12h18"/><path d="M7 7h3v3H7zm7 7h3v3h-3z"/></svg></button>
              <button class="ibtn ibtn-refresh" id="page-refresh-btn" type="button" data-tip="刷新验证码" aria-label="刷新验证码">
                <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20.4 12a8.4 8.4 0 1 1-2.7-6.2" />
                  <path d="M20.8 4.2v4.6h-4.6" />
                </svg>
              </button>

              <button class="sort-btn" id="page-sort-btn" type="button">
                <svg class="i" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.8 6.6h8.4M4.8 12h5.8M4.8 17.4h3.2" />
                  <path d="M17.2 8.6v10" />
                  <path d="m14.4 15.8 2.8 2.8 2.8-2.8" />
                </svg>
                <span id="page-sort-label">最近更新</span>
              </button>

              <button class="btn btn-primary" id="page-add" type="button">
                <svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M12 5.4v13.2M5.4 12h13.2" />
                </svg>
                新增
              </button>
            </div>
          </header>

          <div class="col-head" aria-hidden="true">
            <span class="col-gap"></span>
            <span class="col-main"><i>邮箱</i><i>服务</i></span>
            <span class="col-code">验证码</span>
            <span class="col-gap col-gap-end"></span>
          </div>

          <div class="main-body">
            <div class="viewport" id="viewport">
              <div class="list scroller" id="list" data-view="list" role="list"></div>
            </div>
          </div>

          <div class="statusbar">
            <span><i class="dot" id="status-dot"></i><span id="status-text">本地存储</span></span>
            <span>单击复制验证码 · 双击编辑 · 右键更多</span>
          </div>
          <nav class="compact-actions" aria-label="管理操作">
            <button class="btn btn-ghost btn-xs" id="compact-import" type="button">导入</button>
            <button class="btn btn-ghost btn-xs" id="compact-settings" type="button">设置</button>
            <button class="btn btn-ghost btn-xs" id="compact-lock" type="button">锁定</button>
          </nav>
        </main>
      </div>
    </div>

    <noscript>LocalOTP 需要启用 JavaScript 才能运行。</noscript>

    <script src="js/util.js"></script>
    <script src="js/totp.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/store/security.js"></script>
    <script src="js/store/search.js"></script>
    <script src="js/store/import.js"></script>
    <script src="js/store.js"></script>
    <script src="js/access.js"></script>
    <script src="js/otp-input.js"></script>
    <script src="js/otp-session.js"></script>
    <script src="js/ui/controls.js"></script>
    <script src="js/ui/tooltips.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/select.js"></script>
    <script src="js/list/motion.js"></script>
    <script src="js/list/items.js"></script>
    <script src="js/list/ticker.js"></script>
    <script src="js/list.js"></script>
    <script src="js/sensitive.js"></script>
    <script src="js/sheets/common.js"></script>
    <script src="js/sheets/account.js"></script>
    <script src="js/sheets/quick-add.js"></script>
    <script src="js/sheets/import.js"></script>
    <script src="js/sheets/settings-appearance.js"></script>
    <script src="js/sheets/settings-access.js"></script>
    <script src="js/sheets/settings.js"></script>
    <script src="js/sheets/password.js"></script>
    <script src="js/sheets/categories.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/vendor/jsQR.js"></script>
    <script src="js/qr.js"></script>
    <script src="js/qr-encode.js"></script>
    <script src="js/qr-export.js"></script>
    <script src="js/qr-crop.js"></script>
    <script src="js/scan-picker.js"></script>
    <script src="js/scan.js"></script>
    <script src="js/gate-motion.js"></script>
    <script src="js/app/views.js"></script>
    <script src="js/app/theme.js"></script>
    <script src="js/app/gate.js"></script>
    <script src="js/app/navigation.js"></script>
    <script src="js/app/input.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
